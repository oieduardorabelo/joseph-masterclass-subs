<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communication Masterclass - Joseph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  video { width: 100vw; height: 100vh; display: block; }
  video::cue { background: rgba(0,0,0,0.75); color: #fff; font-size: 1.2em; }
</style>
</head>
<body>
<video id="player" controls autoplay>
  <source src="https://github.com/oieduardorabelo/joseph-masterclass-subs/releases/download/v1.0/ePK37AtnIGX2tpc8.mp4" type="video/mp4">
</video>
<script>
const player = document.getElementById('player');

async function loadTrack(url, lang, label) {
  const res = await fetch(url);
  const srt = await res.text();
  const vtt = 'WEBVTT\n\n' + srt.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
  const blob = new Blob([vtt], { type: 'text/vtt' });
  const track = document.createElement('track');
  track.kind = 'subtitles';
  track.label = label;
  track.srclang = lang;
  track.src = URL.createObjectURL(blob);
  if (lang === 'en') track.default = true;
  player.appendChild(track);
}

loadTrack('en.srt', 'en', 'English');
loadTrack('ja.srt', 'ja', 'Japanese');
</script>
</body>
</html>
